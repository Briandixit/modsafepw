<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · ModSafe</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; }
  :root {
    --bg: #f8fafc; --panel: rgba(255,255,255,0.92); --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --blue: #2563eb; --blue2: #1d4ed8; --soft: #eff6ff; --shadow: 0 18px 40px rgba(15,23,42,0.08);
    --danger: #dc2626;
  }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: radial-gradient(circle at top left, rgba(37,99,235,0.06), transparent 28%),
                radial-gradient(circle at bottom right, rgba(37,99,235,0.04), transparent 25%),
                linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
  }
  .topbar {
    position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.88);
    backdrop-filter: blur(14px); border-bottom: 1px solid rgba(226,232,240,0.85);
  }
  .topbar-inner {
    width: min(1280px, calc(100vw - 32px)); margin: 0 auto; padding: 14px 0;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 38px; width: auto; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: var(--blue); }
  .brand p { margin: 0; color: var(--muted); font-size: 12px; }
  .btn {
    border: none; border-radius: 12px; padding: 10px 15px; font-weight: 800; cursor: pointer;
    transition: 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  }
  .btn.primary { background: linear-gradient(135deg, var(--blue), var(--blue2)); color: white; box-shadow: 0 14px 30px rgba(37,99,235,0.18); }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn.ghost { background: white; color: var(--text); border: 1px solid var(--line); }
  .btn.ghost:hover { transform: translateY(-1px); border-color: #cbd5e1; }
  .container { width: min(1280px, calc(100vw - 32px)); margin: 0 auto; padding: 28px 0 40px; }
  .card {
    background: var(--panel); border: 1px solid rgba(226,232,240,0.95); border-radius: 20px;
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 24px;
  }
  .tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .tab { padding: 12px 20px; font-weight: 800; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { border-bottom-color: var(--blue); color: var(--blue); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 14px; border-bottom: 1px solid #eef2f7; text-align: left; vertical-align: top; font-size: 14px; }
  th { background: #fafcff; color: #64748b; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:hover { background: #fafcff; }
  .abuse { color: #dc2626; font-weight: 900; }
  .spam { color: #d97706; font-weight: 900; }
  .safe { color: #16a34a; font-weight: 900; }
  .login-panel { max-width: 400px; margin: 80px auto; }
  input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 12px; font-size: 14px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .badge { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--soft); color: var(--blue); }
</style>
</head>
<body>
<div id="loginContainer" style="display: none;">
  <div class="container login-panel">
    <div class="card">
      <h2>Admin Login</h2>
      <input type="text" id="adminUser" placeholder="Admin Username" autocomplete="off">
      <input type="password" id="adminPass" placeholder="Password">
      <button class="btn primary" id="loginBtn" style="width:100%">Login</button>
      <div id="loginError" class="error"></div>
    </div>
  </div>
</div>

<div id="dashboard" style="display: none;">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img src="ModSafe.jpg" alt="ModSafe"><div><h1>ModSafe Admin</h1><p>System overview</p></div></div>
      <div><button class="btn ghost" id="logoutBtn">Logout</button></div>
    </div>
  </div>
  <div class="container">
    <div class="tabs">
      <div class="tab active" data-tab="users">Users</div>
      <div class="tab" data-tab="logs">All Moderation Logs</div>
    </div>
    <div id="usersPanel">
      <div class="card">
        <h3>Registered Users</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Username</th><th>API Key</th><th>Plan</th><th>Mode</th><th>Custom Words</th><th>Usage</th><th>Created</th></tr></thead>
            <tbody id="usersTable"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div id="logsPanel" style="display: none;">
      <div class="card">
        <h3>All Moderation Events</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>User</th><th>Text</th><th>Category</th><th>Flagged Word</th><th>Mode</th><th>Confidence</th><th>Time</th></tr></thead>
            <tbody id="logsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let adminToken = null;

async function apiFetch(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (adminToken) headers['Authorization'] = `Bearer ${adminToken}`;
  const res = await fetch(path, { ...options, headers });
  if (!res.ok) {
    let errorMsg = `Request failed (${res.status})`;
    try {
      const data = await res.json();
      errorMsg = data.error || errorMsg;
    } catch(e) {}
    throw new Error(errorMsg);
  }
  return res.json();
}

async function adminLogin() {
  const username = document.getElementById('adminUser').value.trim();
  const password = document.getElementById('adminPass').value.trim();
  const errorDiv = document.getElementById('loginError');
  if (!username || !password) {
    errorDiv.innerText = 'Enter both username and password';
    return;
  }
  errorDiv.innerText = 'Logging in...';
  try {
    const data = await apiFetch('/admin/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    adminToken = data.token;
    localStorage.setItem('adminToken', adminToken);
    showDashboard();
    await loadUsers();
    await loadLogs();
  } catch (err) {
    errorDiv.innerText = err.message || 'Login failed. Check credentials or server logs.';
  }
}

async function loadUsers() {
  const data = await apiFetch('/admin/users');
  const tbody = document.getElementById('usersTable');
  tbody.innerHTML = '';
  for (const u of data.users) {
    tbody.innerHTML += `<tr>
      <td>${escapeHtml(u.username)}</td>
      <td><code>${u.apiKey.substring(0,8)}…</code></td>
      <td>${u.plan}</td>
      <td>${u.moderationMode}</td>
      <td>${u.customWordsCount}</td>
      <td>${u.usage}</td>
      <td>${u.createdAt ? new Date(u.createdAt).toLocaleString() : '-'}</td>
    </tr>`;
  }
}

async function loadLogs() {
  const data = await apiFetch('/admin/logs');
  const tbody = document.getElementById('logsTable');
  tbody.innerHTML = '';
  for (const log of data.logs) {
    tbody.innerHTML += `<tr>
      <td>${escapeHtml(log.username)}</td>
      <td style="max-width:300px; word-break:break-word;">${escapeHtml(log.text)}</td>
      <td class="${log.category}">${log.category}</td>
      <td>${escapeHtml(log.flaggedWord || '-')}</td>
      <td>${log.moderationMode}</td>
      <td>${log.aiConfidence || log.confidence || 0}</td>
      <td>${new Date(log.timestamp).toLocaleString()}</td>
    </tr>`;
  }
}

function escapeHtml(str) { 
  if (!str) return '';
  return String(str).replace(/[&<>]/g, function(m){
    if(m==='&') return '&amp;';
    if(m==='<') return '&lt;';
    if(m==='>') return '&gt;';
    return m;
  });
}

function showDashboard() {
  document.getElementById('loginContainer').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

function logout() {
  adminToken = null;
  localStorage.removeItem('adminToken');
  document.getElementById('loginContainer').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
}

// Event listeners
document.getElementById('loginBtn').addEventListener('click', adminLogin);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    document.getElementById('usersPanel').style.display = target === 'users' ? 'block' : 'none';
    document.getElementById('logsPanel').style.display = target === 'logs' ? 'block' : 'none';
    if (target === 'logs') loadLogs().catch(console.error);
    else loadUsers().catch(console.error);
  });
});

// Auto login if token exists
const storedToken = localStorage.getItem('adminToken');
if (storedToken) {
  adminToken = storedToken;
  showDashboard();
  Promise.all([loadUsers(), loadLogs()]).catch(() => logout());
} else {
  document.getElementById('loginContainer').style.display = 'block';
}
</script>
</body>
</html>
